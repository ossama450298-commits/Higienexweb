<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIGIENEX · Gestión interna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js" defer></script>
<style>
/* ==========================================================================
   HIGIENEX — Sistema de diseño 2026
   Rediseño completo: tokens, tipografía, componentes. Lógica JS intacta.
   ========================================================================== */
:root{
  /* Neutrals — mateixos tons que la web HIGIENEX (blanc càlid / blau) */
  --ink:#1A1A1A; --ink-2:#4A5A6A; --ink-3:#8A9BAC;
  --paper:#F5FAFF; --surface:#FFFFFF; --surface-2:#EFF6FC;
  --line:#D9E5F0; --line-strong:#B9CFE3;
  --hover:#EAF3FC; --soft:#F5FAFF; --sel:#DEEEFB;

  /* Accents — paleta HIGIENEX (blau corporatiu) */
  --blue:#1565A8; --blue-dk:#0B3D6B;      /* green-mid / green-deep — info/links/focus */
  --teal:#0E8F6A; --teal-dk:#0B7256;      /* verd — success/positive */
  --amber:#B0720C; --amber-dk:#8A5900;    /* pending/warning */
  --red:#AE3427; --red-dk:#8C281E;        /* danger/negative */
  --purple:#2196D3; --purple-dk:#1565A8;  /* blau brillant — secondary highlight */
  --action:#F2A900; --action-dk:#C48400;  /* daurat HIGIENEX — primary call to action */

  /* Brand (HIGIENEX identity, mateix daurat que la web) */
  --gold:#F2A900; --gold-dk:#C48400;

  /* Sidebar (blau HIGIENEX, mateix to que el nav de la web) */
  --side:#0B3D6B; --side-h:#123F73; --side-line:#1A5490; --side-ink:#EAF3FC; --side-ink-2:#9CC3E8;

  /* Geometry */
  --radius-sm:10px; --radius:14px; --radius-lg:20px; --radius-xl:26px;
  --side-w:264px; --side-w-collapsed:76px;

  /* Elevation (to blau) */
  --shadow-xs:0 1px 2px rgba(11,61,107,.05);
  --shadow-sm:0 2px 6px rgba(11,61,107,.06), 0 1px 2px rgba(11,61,107,.05);
  --shadow-md:0 10px 26px rgba(11,61,107,.09), 0 2px 6px rgba(11,61,107,.05);
  --shadow-lg:0 26px 64px rgba(11,61,107,.16), 0 6px 16px rgba(11,61,107,.08);
  --shadow-glow:0 0 0 6px rgba(21,101,168,.12);
}
[data-theme="dark"]{
  --ink:#E4EDF5; --ink-2:#8CA3B8; --ink-3:#5C7A96;
  --paper:#081B2E; --surface:#0F2A46; --surface-2:#123253;
  --line:#1B3E5F; --line-strong:#28527A;
  --hover:#123253; --soft:#0B2338; --sel:#123B63;

  --blue:#4FA6E8; --blue-dk:#2196D3;
  --teal:#3FC79A; --teal-dk:#22A87C;
  --amber:#E8B23E; --amber-dk:#C48A00;
  --red:#F0596A; --red-dk:#E0374A;
  --purple:#5CAEEA; --purple-dk:#2196D3;
  --action:#F2A900; --action-dk:#C9971C;

  --gold:#F2A900; --gold-dk:#C9971C;

  --side:#061626; --side-h:#0C2440; --side-line:#173A5C; --side-ink:#C9DCEE; --side-ink-2:#6E90AC;

  --shadow-xs:0 1px 2px rgba(0,0,0,.35);
  --shadow-sm:0 2px 8px rgba(0,0,0,.35);
  --shadow-md:0 12px 28px rgba(0,0,0,.42);
  --shadow-lg:0 30px 70px rgba(0,0,0,.55);
  --shadow-glow:0 0 0 6px rgba(79,166,232,.16);
}
[data-theme="dark"] .tag{background:transparent}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--surface-2);color:var(--ink)}
[data-theme="dark"] .btn.ghost{background:var(--surface)}
[data-theme="dark"] #login .box{background:var(--surface)}
[data-theme="dark"] .kpi .trend.up{background:transparent}
[data-theme="dark"] .kpi .trend.down{background:transparent}
[data-theme="dark"] .t-gold{background:transparent;color:var(--gold)}

/* -------------------------------------------------------------- base -- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{transition:background .2s,color .2s}
body{font-family:'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;letter-spacing:-.02em}
.mono,.num,td.num,th.num{font-family:'JetBrains Mono','IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.num{text-align:right}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
::selection{background:var(--sel);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}

/* --------------------------------------------------------- entrance -- */
@keyframes hxFadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes hxFadeIn{from{opacity:0}to{opacity:1}}
@keyframes hxModalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes hxPulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(74,85,255,.35)}50%{box-shadow:0 0 0 6px rgba(74,85,255,0)}}
.card,.kpi{animation:hxFadeUp .32s cubic-bezier(.16,1,.3,1) both}
.grid.g4 .kpi:nth-child(2),.grid.g3 .kpi:nth-child(2),.grid.g4 .card:nth-child(2){animation-delay:.03s}
.grid.g4 .kpi:nth-child(3),.grid.g3 .kpi:nth-child(3),.grid.g4 .card:nth-child(3){animation-delay:.06s}
.grid.g4 .kpi:nth-child(4),.grid.g4 .card:nth-child(4){animation-delay:.09s}
@media (prefers-reduced-motion:reduce){.card,.kpi{animation:none}}

/* ------------------------------------------------------------ login -- */
#login{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 120% at 15% 0%,#123F73 0%,var(--side) 55%,#061626 100%);display:flex;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:400px;background:var(--surface);border-radius:var(--radius-xl);padding:0 0 30px;box-shadow:var(--shadow-lg);border:1px solid var(--line);animation:hxModalIn .4s cubic-bezier(.16,1,.3,1) both;overflow:hidden}
#login .box{border-top:none}
.loginLogoWrap{background:var(--side);margin:0 0 26px;padding:36px 32px 26px;border-radius:0}
.loginLogo{display:block;width:80%;max-width:300px;height:auto;margin:0 auto}
#login .eyebrow{margin:0 32px 20px;display:block}
#login .field,#login .btn.block,#login .err,#login .hint{margin-left:32px;margin-right:32px}
.eyebrow{font-family:'JetBrains Mono','IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.field{margin-bottom:18px}
.field label,.flabel{display:block;font-size:12.5px;font-weight:700;margin-bottom:7px;color:var(--ink-2);letter-spacing:.005em}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:var(--shadow-glow);background:var(--surface)}
input[disabled],select[disabled]{background:var(--paper);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:1.5px solid var(--action);background:var(--action);color:#fff;border-radius:var(--radius-sm);font-weight:700;font-size:13.5px;letter-spacing:-.005em;cursor:pointer;box-shadow:var(--shadow-xs);transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;min-height:38px}
.btn:hover{background:var(--action-dk);border-color:var(--action-dk);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:focus-visible{outline:2px solid var(--action-dk);outline-offset:2px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:none}
.btn.ghost:hover{background:var(--hover);border-color:var(--ink-3);box-shadow:var(--shadow-xs)}
.btn.sm{padding:6px 12px;font-size:12px;min-height:30px;border-radius:8px}
.btn.block{width:100%;justify-content:center;padding:12px}
.btn[disabled]{opacity:.42;cursor:not-allowed;pointer-events:none;transform:none;box-shadow:none}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn.gold{background:var(--gold);border-color:var(--gold-dk);color:#1A1200}
.btn.gold:hover{background:var(--gold-dk);border-color:var(--gold-dk)}
.hint{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);line-height:1.7}
.hint code{font-family:'JetBrains Mono',monospace;background:var(--paper);padding:2px 5px;border-radius:5px}
.err{color:var(--red);font-size:12.5px;font-weight:700;margin-bottom:12px;display:none}

/* --------------------------------------------------------- app shell -- */
#app{display:none;min-height:100%}
.shell{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh;transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1)}
.shell.collapsed{grid-template-columns:var(--side-w-collapsed) 1fr}
aside{background:var(--side);color:var(--side-ink);padding:18px 12px 22px;position:sticky;top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;overflow-y:auto;border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transition:padding .2s}
aside .logo{font-family:'Plus Jakarta Sans';font-size:18px;font-weight:800;color:#fff;padding:2px 8px 2px;letter-spacing:-.02em}
aside .logo span{color:var(--blue)}
aside .sub{padding:0 8px 16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-ink-2)}
aside .sideLogo{display:block;width:calc(100% - 8px);margin:2px 4px 12px;padding:12px 8px;background:#0000;border-radius:12px}
.sidetoggle{background:none;border:1px solid transparent;color:var(--side-ink-2);cursor:pointer;padding:7px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin:0 4px 8px auto;transition:background .15s,color .15s}
.sidetoggle:hover{background:var(--side-h);color:#fff}
.sidetoggle svg{width:16px;height:16px;transition:transform .2s}
.shell.collapsed .sidetoggle svg{transform:rotate(180deg)}
.navgroup{padding:16px 12px 6px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-ink-2);opacity:.9}
.navitem{display:flex;justify-content:flex-start;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;margin:1px 0;border:0;border-radius:11px;background:none;color:var(--side-ink);cursor:pointer;font-size:13.5px;font-weight:600;transition:background .15s,color .15s,transform .1s}
.navitem:hover{background:var(--side-h);color:#fff}
.navitem.on{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 4px 14px rgba(74,85,255,.35)}
.navitem svg{width:16.5px;height:16.5px;flex-shrink:0;opacity:.9}
.navitem span.navlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.navitem .badge{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--red);color:#fff;border-radius:20px;padding:1.5px 7px;font-weight:700}
.shell.collapsed .navitem{justify-content:center;padding:11px}
.shell.collapsed .navitem span.navlabel,.shell.collapsed .navitem .badge,.shell.collapsed .navgroup,.shell.collapsed aside .sub,.shell.collapsed aside .logo span.logotext{display:none}
.shell.collapsed aside .sideLogo{width:38px;margin:2px auto 12px;padding:6px}
.shell.collapsed aside .logo{text-align:center;padding:2px 0}
.navitem:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

main{min-width:0;display:flex;flex-direction:column}
.topbar{background:color-mix(in srgb,var(--paper) 72%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.avatar{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;font-family:'Plus Jakarta Sans';box-shadow:var(--shadow-sm)}
.exercise{font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid var(--line-strong);padding:4px 10px;border-radius:20px;color:var(--ink-2);font-weight:600}
.wrap{padding:32px 36px 76px;max-width:1480px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:18px;margin-bottom:28px;flex-wrap:wrap}
.pagehead h1{font-size:27px;font-weight:800;letter-spacing:-.025em}
.pagehead .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.pagehead p{color:var(--ink-2);font-size:13.5px;margin-top:5px;font-weight:500}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;min-width:230px;padding:9px 13px;font-size:13px}
.toolbar .count,.tblcount{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2);margin-left:auto;letter-spacing:.03em;font-weight:600}

/* ---------------------------------------------------------- surfaces -- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s,border-color .2s}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.card>h3{padding:17px 20px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700;letter-spacing:-.008em;display:flex;align-items:center;gap:10px}
.cardbody{padding:22px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g4,.g3,.g2{grid-template-columns:1fr}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.kpi .val{font-family:'Plus Jakarta Sans',sans-serif;font-size:30px;font-weight:800;margin-top:9px;letter-spacing:-.03em;line-height:1.1}
.kpi .foot{font-size:12px;color:var(--ink-2);margin-top:6px;font-weight:500}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px}
.kpi.acc-blue::before{background:linear-gradient(180deg,var(--blue),var(--purple))}
.kpi.acc-teal::before{background:var(--teal)}
.kpi.acc-amber::before{background:var(--amber)}
.kpi.acc-red::before{background:var(--red)}
.kpi.acc-gold::before{background:var(--gold)}
.kpi .trend{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;margin-top:8px;padding:2px 9px;border-radius:20px}
.kpi .trend.up{color:var(--teal-dk);background:rgba(15,157,116,.12)}
.kpi .trend.down{color:var(--red-dk);background:rgba(220,53,69,.12)}
.kpi .trend svg{width:11px;height:11px}

/* -------------------------------------------------------------- tabs -- */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabbar button{background:none;border:0;padding:11px 4px;margin-right:22px;font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s}
.tabbar button:hover{color:var(--ink)}
.tabbar button.on{color:var(--blue);border-color:var(--blue)}

/* ------------------------------------------------------------ tables -- */
.tblwrap{border-radius:var(--radius-lg);overflow:auto;max-height:min(72vh,760px);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:13.2px}
thead th{position:sticky;top:0;z-index:5;text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);padding:13px 16px;background:var(--surface-2);border-bottom:1px solid var(--line-strong);white-space:nowrap;font-weight:700}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--hover)}
tr.clickable{cursor:pointer}
tr.clickable:hover{box-shadow:inset 3px 0 0 var(--blue)}
tr.total td{background:var(--surface-2);font-weight:700;border-top:1px solid var(--line-strong)}
.empty{padding:48px 20px;text-align:center;color:var(--ink-2);font-size:13px}
.empty strong{display:block;color:var(--ink);font-family:'Plus Jakarta Sans';font-size:15px;margin-bottom:6px;font-weight:700}

/* --------------------------------------------------------------- tags -- */
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap;font-weight:700}
.t-ok{color:var(--teal-dk);border-color:rgba(15,157,116,.3);background:rgba(15,157,116,.1)}
.t-wait{color:var(--amber-dk);border-color:rgba(217,119,6,.3);background:rgba(217,119,6,.1)}
.t-late{color:var(--red-dk);border-color:rgba(220,53,69,.3);background:rgba(220,53,69,.1)}
.t-neu{color:var(--ink-2);border-color:var(--line-strong);background:var(--surface-2)}
.t-blue{color:var(--blue-dk);border-color:rgba(74,85,255,.3);background:rgba(74,85,255,.1)}
.t-gold{color:var(--gold-dk);border-color:rgba(201,151,28,.35);background:rgba(201,151,28,.12)}
.pos{color:var(--teal-dk);font-weight:700}
.neg{color:var(--red-dk);font-weight:700}

.bar{height:7px;background:var(--surface-2);border-radius:20px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:20px}
.bar i.low{background:var(--red)}
.bar i.mid{background:var(--amber)}

/* -------------------------------------------------- reconciliation -- */
.recon{display:grid;grid-template-columns:1fr 100px 1fr;gap:18px}
@media(max-width:900px){.recon{grid-template-columns:1fr;gap:14px}.recon .bridge{order:3}}
.recon .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.recon .col h4{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.reconlist{max-height:460px;overflow-y:auto}
.ritem{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:center;border-left:3px solid transparent;transition:background .12s}
.ritem:hover{background:var(--hover)}
.ritem.sel{background:var(--sel);border-left-color:var(--blue)}
.ritem .meta{min-width:0;flex:1}
.ritem .t1{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .t2{font-size:11.5px;color:var(--ink-2);font-family:'JetBrains Mono',monospace}
.ritem .amt{font-family:'JetBrains Mono',monospace;font-weight:700;white-space:nowrap}
.bridge{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;gap:12px}
.bridge .link{width:100%;height:2px;background:var(--line-strong)}
.bridge.armed .link{background:var(--blue)}
.bridge .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface)}
.bridge.armed .dot{border-color:var(--blue);background:var(--blue)}
.bridge .delta{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:center;color:var(--ink-2)}
.bridge .delta.bad{color:var(--red-dk);font-weight:700}
.bridge .delta.good{color:var(--teal-dk);font-weight:700}

/* ---------------------------------------------------------- pipeline -- */
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.pipe{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.pipe{grid-template-columns:1fr}}
.pipecol{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);min-height:130px;box-shadow:var(--shadow-sm)}
.pipecol h4{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.opp{padding:12px 14px;border-bottom:1px solid var(--line)}
.opp .n{font-weight:700;font-size:13px}
.opp .c{font-size:12px;color:var(--ink-2)}
.opp .v{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;margin-top:5px}
.opp .mv{margin-top:8px;display:flex;gap:6px}

/* ------------------------------------------------------------- modal -- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(12,12,14,.6);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:44px 18px;overflow-y:auto}
#modal.on{display:flex}
#modal .box{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:680px;box-shadow:var(--shadow-lg);animation:hxModalIn .22s cubic-bezier(.16,1,.3,1) both}
#modal .box.wide{max-width:960px}
#modal .mh{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
#modal .mh h3{font-size:17px;font-weight:700}
#modal .mh button{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-2);width:32px;height:32px;border-radius:8px;transition:background .15s}
#modal .mh button:hover{background:var(--hover)}
#modal .mb{padding:26px}
#modal .mb .frow + .frow{margin-top:2px}
#modal .mf{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2);flex-wrap:wrap;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.frow.f3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:600px){.frow,.frow.f3{grid-template-columns:1fr}}
.lines th{font-size:10px}
.lines input,.lines select{padding:7px 9px;font-size:12.5px}
.totbox{margin-top:16px;margin-left:auto;width:280px;font-family:'JetBrains Mono',monospace;font-size:13px}
.totbox div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.totbox div:last-child{border-bottom:0;font-weight:700;font-size:15px;padding-top:10px}
.field.invalid input,.field.invalid select{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,53,69,.12)}
.field .errmsg{display:none;color:var(--red);font-size:11.5px;margin-top:5px;font-weight:700}
.field.invalid .errmsg{display:block}

@keyframes hxModalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion:reduce){#modal.on .box{animation:none}}

/* ------------------------------------------------------------- toast -- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(140%);background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:20px;font-size:13.5px;font-weight:600;z-index:200;transition:transform .28s cubic-bezier(.16,1,.3,1);max-width:90vw;box-shadow:var(--shadow-lg)}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ------------------------------------------------------------ ledger -- */
.rec{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.rec .l{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--line)}
.rec .sec{margin-top:18px;font-family:'Plus Jakarta Sans';font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);border-bottom:1px solid var(--line-strong);padding-bottom:6px}
.rec .tot{display:flex;justify-content:space-between;padding:11px 0;font-weight:700;font-size:15px}

/* ----------------------------------------------------- command palette -- */
#palette{position:fixed;inset:0;z-index:90;background:rgba(10,10,12,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:90px 18px}
#palette.on{display:flex}
#palette .pbox{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-lg);width:100%;max-width:620px;overflow:hidden;box-shadow:var(--shadow-lg);animation:hxModalIn .2s cubic-bezier(.16,1,.3,1) both}
#palette input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 22px;font-size:15.5px;background:var(--surface)}
#palette input:focus{box-shadow:none;border-color:var(--line)}
#palette .plist{max-height:400px;overflow-y:auto;padding:6px}
.pres{padding:11px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;border-radius:10px;border-left:3px solid transparent}
.pres:hover,.pres.k{background:var(--hover);border-left-color:var(--blue)}
.pres .pt{font-weight:700;font-size:13.5px}
.pres .ps{font-size:11.5px;color:var(--ink-2)}
.pres .pk{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);padding:2px 7px;border-radius:6px}
#palette .pfoot{padding:10px 20px;border-top:1px solid var(--line);background:var(--surface-2);font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-2)}
.kbd{font-family:'JetBrains Mono',monospace;font-size:10.5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--ink-2);background:var(--surface-2)}
.searchbtn{display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);border-radius:20px;color:var(--ink-2);cursor:pointer;font-size:12.5px;min-width:220px;font-weight:600;transition:border-color .15s,box-shadow .15s}
.searchbtn:hover{border-color:var(--blue);color:var(--ink);box-shadow:var(--shadow-xs)}
.searchbtn .kbd{margin-left:auto}
@media(max-width:820px){.searchbtn{min-width:0}.searchbtn span.lbl{display:none}}

/* ----------------------------------------------------- foldable panels -- */
.panelfold{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-sm)}
.panelfold summary{padding:13px 18px;cursor:pointer;font-weight:700;font-size:13px;color:var(--blue);list-style:none;display:flex;align-items:center;gap:8px}
.panelfold summary::-webkit-details-marker{display:none}
.panelfold summary::before{content:'▸';font-size:11px;color:var(--ink-2);transition:transform .15s}
.panelfold[open] summary::before{transform:rotate(90deg)}
.panelfold summary:hover{background:var(--hover)}
.panelfold-body{padding:18px;border-top:1px solid var(--line);background:var(--surface-2)}

/* ------------------------------------------------------- quick actions -- */
.qa-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.qa-btn{display:flex;align-items:center;gap:9px;padding:11px 18px;border:1px solid var(--line);background:var(--surface);border-radius:16px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-xs);transition:box-shadow .15s,transform .15s,border-color .15s}
.qa-btn:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--blue)}
.qa-btn svg{width:15px;height:15px;color:var(--action)}
.qa-btn .qk{margin-left:6px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-2);border:1px solid var(--line-strong);padding:1px 5px;border-radius:5px}

/* ------------------------------------------------------------- charts -- */
.chartcard canvas{width:100% !important;max-height:260px}

/* ------------------------------------------------------- activity feed -- */
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:13px;padding:12px 0;border-bottom:1px dotted var(--line)}
.feed-item:last-child{border-bottom:0}
.feed-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;background:linear-gradient(135deg,var(--blue),var(--purple))}
.feed-item .t1{font-size:13px;font-weight:700}
.feed-item .t2{font-size:11.5px;color:var(--ink-2);margin-top:2px}

/* -------------------------------------------------------- goal ring -- */
.goalring{display:flex;align-items:center;gap:18px}
.goalring .ring{width:88px;height:88px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:conic-gradient(var(--blue) calc(var(--pct,0)*1%), var(--line) 0)}
.goalring .ring::after{content:attr(data-pct);width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:'Plus Jakarta Sans';font-weight:800;font-size:16px}
.goalring .glabel{font-size:13px;font-weight:700}
.goalring .gfoot{font-size:12px;color:var(--ink-2);margin-top:3px}

/* --------------------------------------------------------- accessibility -- */
button,.navitem,.btn,a{min-height:32px}
:focus-visible{outline-width:2px;outline-offset:2px}

/* ------------------------------------------------------------ responsive -- */
@media(max-width:1080px){.wrap{padding:22px 20px 60px}}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .shell.collapsed{grid-template-columns:1fr}
  aside{position:static;height:auto;margin:12px;border-radius:var(--radius-lg)}
  .sidetoggle{display:none}
  .wrap{padding:18px 14px 50px}
  .topbar{padding:12px 16px}
  .qa-bar{gap:8px}
  .qa-btn{flex:1 1 44%;justify-content:center}
  .goalring{flex-direction:column;text-align:center}
}
@media(max-width:560px){
  .pagehead{flex-direction:column;align-items:flex-start}
  .pagehead .actions{margin-left:0;width:100%}
  .grid.g4,.grid.g3,.grid.g2{grid-template-columns:1fr}
  .qa-btn{flex:1 1 100%}
}

</style>
</head>

   PERSISTENCIA LOCAL (localStorage)
   Guarda automáticamente el estado del ERP en el navegador
   para que sobreviva a recargas de página, y permite volver
   a los datos de ejemplo originales cuando se desee.
   ========================================================= */
const HX_DB_KEY = 'hx_erp_db_v1';
function guardarDB(){
  try{ localStorage.setItem(HX_DB_KEY, JSON.stringify(DB)); }catch(e){}
}
let _hxSaveTimer = null;
function guardarDBDebounced(){
  clearTimeout(_hxSaveTimer);
  _hxSaveTimer = setTimeout(guardarDB, 300);
}
function cargarDB(){
  try{
    const raw = localStorage.getItem(HX_DB_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    Object.keys(saved).forEach(k=>{
      if(Array.isArray(saved[k])){
        if(!Array.isArray(DB[k])) DB[k] = [];
        DB[k].length = 0;
        DB[k].push(...saved[k]);
      } else {
        DB[k] = saved[k];
      }
    });
    return true;
  }catch(e){ return false; }
}

  try{ localStorage.removeItem(HX_DB_KEY); }catch(e){}
  location.reload();
}

/* ---------- Motor contable ---------- */
function nuevoAsiento(fecha,concepto,apuntes,origen){
  const d=apuntes.reduce((s,p)=>s+(p.d||0),0), h=apuntes.reduce((s,p)=>s+(p.h||0),0);
  if(Math.abs(d-h)>0.01) console.warn('Asiento descuadrado',concepto,d,h);
  const a={id:uid('AS'),n:DB.asientos.length+1,fecha,concepto,apuntes,origen};
  DB.asientos.push(a); return a;
}
function asientoFacturaE(f){
  const c=DB.clientes.find(x=>x.id===f.cli);
  return nuevoAsiento(f.fecha,'S/factura '+f.num+' · '+c.nom,
    [{cta:c.cta,d:f.total,h:0},{cta:'700',d:0,h:f.base},{cta:'477',d:0,h:f.cuota}],
    'FE:'+f.num);
}
function asientoFacturaR(f){
  const p=DB.proveedores.find(x=>x.id===f.prov);
  return nuevoAsiento(f.fecha,'S/factura '+f.num+' · '+p.nom,
    [{cta:f.cuenta,d:f.base,h:0},{cta:'472',d:f.cuota,h:0},{cta:p.ctaProv,d:0,h:f.total}],
    'FR:'+f.num);
}
function asientoCobroPago(m){
  const banco=DB.bancos.find(b=>b.id===m.cta);
  if(m.imp>0){
    const f=DB.facturasE.find(x=>x.num===m.conc), c=DB.clientes.find(x=>x.id===f.cli);
    return nuevoAsiento(m.fecha,'Cobro '+f.num+' · '+c.nom,
      [{cta:banco.cta,d:m.imp,h:0},{cta:c.cta,d:0,h:m.imp}],'COB:'+f.num);
  }
  const f=DB.facturasR.find(x=>x.num===m.conc), p=DB.proveedores.find(x=>x.id===f.prov);
  return nuevoAsiento(m.fecha,'Pago '+f.num+' · '+p.nom,
    [{cta:p.ctaProv,d:-m.imp,h:0},{cta:banco.cta,d:0,h:-m.imp}],'PAG:'+f.num);
}
function saldosCuentas(hasta){

  }));

}

/* ---------- Almacén: kardex y precio medio ponderado ---------- */
function movimientoStock(artId,tipo,cant,precio,doc,fecha){
  const p=art(artId); if(!p) return;
  let importe=0;
  if(tipo==='Entrada'){
    importe=cant*precio;
    const nuevoValor=p.valor+importe, nuevaCant=p.stock+cant;
    p.stock=nuevaCant; p.valor=nuevoValor; p.pmp=nuevaCant>0?nuevoValor/nuevaCant:precio;
  } else {
    const real=Math.min(cant,p.stock);
    importe=real*p.pmp;
    p.stock-=real; p.valor=Math.max(0,p.valor-importe);
    if(p.stock===0) p.valor=0;
  }
  DB.movStock.push({id:uid('MS'),fecha:fecha||TODAY,art:artId,tipo,cant,precio:tipo==='Entrada'?precio:p.pmp,
                    importe,doc,saldoCant:p.stock,saldoValor:p.valor,pmp:p.pmp});
}

function cli(id){ return DB.clientes.find(c=>c.id===id) || {nom:'—'}; }
function prov(id){ return DB.proveedores.find(p=>p.id===id) || {nom:'—'}; }
function emp(id){ return DB.empleados.find(e=>e.id===id) || {nom:'—'}; }

  const found=USERS.find(x=>[x.mail,x.alias,x.nom,x.nom.split(' ')[0]].some(v=>v.toLowerCase()===u)&&x.pass===p);
  if(!found){document.getElementById('loginErr').style.display='block';return;}
  ME=found;
  cargarDB();
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoName').textContent=ME.nom+' · '+ME.rol;
  document.getElementById('whoAv').textContent=ME.nom.split(' ').map(w=>w[0]).slice(0,2).join('');
  buildNav(); go('panel');
  try{ if(localStorage.getItem('hx_sidebar_collapsed')==='1') document.querySelector('.shell').classList.add('collapsed'); }catch(e){}
  toast('Sesión iniciada. Bienvenido, '+ME.nom.split(' ')[0]+'.');
}
function logout(){ME=null;document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';document.getElementById('lp').value='';document.getElementById('loginErr').style.display='none';}

function can(area){
  if(!ME) return false;
  if(area==='super') return ME.perms==='all';
  if(ME.perms==='all'||area==='all') return true;
  if(ME.perms==='admin')     return ['admin','comercial','rrhh','logistica'].includes(area);
  if(ME.perms==='comercial') return area==='comercial';
  if(ME.perms==='logistica') return area==='logistica';
  return false;
}
const isAdmin = () => !!ME && ME.perms==='all';
function avisos(v){
  if(v==='concilia') return DB.movimientos.filter(m=>!m.conc).length;
  if(v==='almacen')  return DB.productos.filter(p=>p.stock<p.min).length;
  if(v==='expediciones') return (typeof facturasSinExpedir==='function') ? facturasSinExpedir().length : 0;
  if(v==='femitidas')return DB.facturasE.filter(f=>f.estado==='Pendiente'&&f.venc<TODAY).length;
  if(v==='calidad')  return (DB.lotes||[]).filter(l=>l.estado==='Cuarentena').length+(DB.noconf||[]).filter(n=>n.estado==='Abierta').length;
  if(v==='materias') return (DB.materias||[]).filter(m=>m.stock<m.min).length;
  if(v==='automat')  return typeof evaluarReglas==='function'?evaluarReglas().length:0;
  return 0;
}
function buildNav(){
  let h='';
  NAV.forEach(sec=>{
    const vis=sec.items.filter(i=>can(i[2]));
    if(!vis.length) return;
    if(sec.g) h+='<div class="navgroup">'+sec.g+'</div>';
    vis.forEach(i=>{ const n=avisos(i[0]);
      const icon=NAV_ICONS[i[0]]||'circle';
      h+='<button class="navitem" data-v="'+i[0]+'" title="'+i[1]+'" onclick="go(\''+i[0]+'\')"><i data-lucide="'+icon+'"></i><span class="navlabel">'+i[1]+'</span>'+(n?'<span class="badge">'+n+'</span>':'')+'</button>'; });
  });
  document.getElementById('nav').innerHTML=h;
  document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));
  renderExtras();
}
function toggleSidebar(){
  const shell=document.querySelector('.shell');
  shell.classList.toggle('collapsed');
  try{ localStorage.setItem('hx_sidebar_collapsed', shell.classList.contains('collapsed')?'1':'0'); }catch(e){}
  renderExtras();
}
function renderExtras(){
  try{ if(window.lucide && typeof lucide.createIcons==='function') lucide.createIcons(); }catch(e){}
}
let HX_SALES_CHART=null;
function initDashboardChart(){
  const canvas=document.getElementById('hxSalesChart');
  if(!canvas || typeof Chart==='undefined') return;
  try{
    if(HX_SALES_CHART){ HX_SALES_CHART.destroy(); HX_SALES_CHART=null; }
    const meses=[]; const totales=[];
    const base=new Date(TODAY);
    for(let i=5;i>=0;i--){
      const d=new Date(base.getFullYear(), base.getMonth()-i, 1);
      const ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      meses.push(d.toLocaleDateString('es-ES',{month:'short'}));
      const tot=DB.facturasE.filter(f=>f.fecha && f.fecha.slice(0,7)===ym).reduce((a,f)=>a+f.base,0);
      totales.push(Math.round(tot));
    }
    const css=getComputedStyle(document.documentElement);
    const blue=css.getPropertyValue('--blue').trim()||'#1668A8';
    const ink2=css.getPropertyValue('--ink-2').trim()||'#3C5063';
    const line=css.getPropertyValue('--line').trim()||'#D7E0E7';
    HX_SALES_CHART=new Chart(canvas.getContext('2d'),{
      type:'line',
      data:{labels:meses,datasets:[{label:'Ventas (€)',data:totales,borderColor:blue,backgroundColor:blue+'22',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:blue}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{
          x:{grid:{display:false},ticks:{color:ink2,font:{family:'IBM Plex Mono',size:10}}},
          y:{grid:{color:line},ticks:{color:ink2,font:{family:'IBM Plex Mono',size:10}}}
        }
      }
    });
  }catch(e){ /* Chart.js not available offline: fail silently, KPI cards still show the data */ }
}
let VIEW='panel';
const ROUTES={};
function go(v,keepQ){
  if(v!==VIEW && !keepQ) Q='';
  VIEW=v;
  document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const label=NAV.flatMap(s=>s.items).find(i=>i[0]===v);
  document.getElementById('crumb').textContent=label?label[1]:'Panel';
  document.getElementById('view').innerHTML=(ROUTES[v]||ROUTES.panel)();
  buildNav();
  renderExtras();
  initDashboardChart();
  if(!keepQ) window.scrollTo(0,0);
}
function refresh(){ guardarDBDebounced(); go(VIEW,true); }

/* Cálculos compartidos */
const pendCobro = ()=>DB.facturasE.filter(f=>f.estado==='Pendiente');
const pendPago  = ()=>DB.facturasR.filter(f=>f.estado==='Pendiente');
const tesoreria = ()=>DB.bancos.reduce((s,b)=>s+b.saldo,0);
const vencida   = f=>f.estado==='Pendiente'&&f.venc<TODAY;
const saldoCliente = id=>DB.facturasE.filter(f=>f.cli===id&&f.estado==='Pendiente').reduce((s,f)=>s+f.total,0);
const saldoProv    = id=>DB.facturasR.filter(f=>f.prov===id&&f.estado==='Pendiente').reduce((s,f)=>s+f.total,0);
function estadoTag(f){
  if(f.estado==='Cobrada') return '<span class="tag t-ok">Cobrada</span>';
  if(f.estado==='Pagada')  return '<span class="tag t-ok">Pagada</span>';
  if(vencida(f))           return '<span class="tag t-late">Vencida</span>';
  return '<span class="tag t-wait">Pendiente</span>';
}

    '<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveCliente('+(id?'\''+id+'\'':'null')+')">Guardar</button>');

function saveCliente(id){
  const nom=val('nc_nom').trim(), nif=val('nc_nif').trim().toUpperCase();
  if(!nom||!nif){toast('Hacen falta la razón social y el NIF.');return;}
  if(DB.clientes.some(c=>c.nif===nif&&c.id!==id)){toast('Ya existe un cliente con ese NIF.');return;}
  const datos={nom,nif,dir:val('nc_dir').trim(),pob:val('nc_pob').trim(),tel:val('nc_tel').trim(),
               mail:val('nc_mail').trim(),cond:+val('nc_cond'),resp:val('nc_resp')};
  if(id){ Object.assign(cli(id),datos); CUENTAS[cli(id).cta].nom=nom; toast('Cliente actualizado.'); }
  else{
    const c={id:uid('C'),...datos,alta:TODAY};
    c.cta=nuevaSubcuenta('430',nom,'activo');
    DB.clientes.push(c);
    toast('Cliente dado de alta con la subcuenta '+c.cta+'.');
  }
  closeModal(); go('clientes');
}

  const nom=val('np_nom').trim(), nif=val('np_nif').trim().toUpperCase();

  if(DB.proveedores.some(p=>p.nif===nif&&p.id!==id)){toast('Ya existe un proveedor con ese NIF.');return;}
  const datos={nom,nif,dir:val('np_dir').trim(),pob:val('np_pob').trim(),tel:val('np_tel').trim(),
               mail:val('np_mail').trim(),cond:+val('np_cond'),cta:val('np_cta')};
  if(id){ Object.assign(prov(id),datos); CUENTAS[prov(id).ctaProv].nom=nom; toast('Proveedor actualizado.'); }
  else{
    const p={id:uid('P'),...datos,alta:TODAY};

let LIN=[];
function formFacturaE(cliPre){
  LIN=[{art:DB.productos[0].id,cant:1,precio:DB.productos[0].pvp}];
  openModal('Nueva factura a cliente',
    '<div class="frow f3" style="margin-bottom:16px">'+

    '</div><div id="linBox"></div>',
    '<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveFacturaE()">Emitir y contabilizar</button>',true);
  drawLin();
}
function drawLin(){
  const rows=LIN.map((l,i)=>{
    const p=art(l.art);
    return '<tr>'+
    '<td><select onchange="setLin('+i+',\'art\',this.value)">'+DB.productos.map(x=>'<option value="'+x.id+'"'+(x.id===l.art?' selected':'')+'>'+esc(x.ref+' · '+x.nom)+'</option>').join('')+'</select>'+
      '<div style="font-size:11px;color:'+(p.stock<l.cant?'var(--red)':'var(--ink-2)')+';margin-top:3px" class="mono">stock '+p.stock+' · pmp '+EUR(p.pmp)+'</div></td>'+
    '<td style="width:88px"><input type="number" min="1" value="'+l.cant+'" onchange="setLin('+i+',\'cant\',this.value)"></td>'+
    '<td style="width:98px"><input type="number" step="0.01" value="'+l.precio+'" onchange="setLin('+i+',\'precio\',this.value)"></td>'+
    '<td class="num mono">'+EUR(l.cant*l.precio)+'</td>'+
    '<td class="num mono" style="color:var(--teal)">'+EUR(l.cant*(l.precio-p.pmp))+'</td>'+
    '<td style="width:38px"><button class="btn ghost sm" onclick="delLin('+i+')">×</button></td></tr>';
  }).join('');
  const base=LIN.reduce((s,l)=>s+l.cant*l.precio,0);
  const margen=LIN.reduce((s,l)=>s+l.cant*(l.precio-art(l.art).pmp),0);
  document.getElementById('linBox').innerHTML=
    '<div class="eyebrow" style="display:block;margin-bottom:8px">Líneas de la factura</div>'+
    '<table class="lines"><thead><tr><th>Artículo</th><th>Cant.</th><th>Precio</th><th class="num">Importe</th><th class="num">Margen</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<button class="btn ghost sm" style="margin-top:10px" onclick="addLin()">+ Añadir línea</button>'+
    '<div class="totbox"><div><span>Base imponible</span><span>'+EUR(base)+'</span></div><div><span>IVA 21%</span><span>'+EUR(base*IVA)+'</span></div>'+
    '<div><span>Margen bruto</span><span>'+EUR(margen)+'</span></div><div><span>Total factura</span><span>'+EUR(base*1.21)+'</span></div></div>';
}
function setLin(i,k,v){ LIN[i][k]=k==='art'?v:(+v||0); if(k==='art') LIN[i].precio=art(v).pvp; drawLin(); }
function addLin(){ LIN.push({art:DB.productos[0].id,cant:1,precio:DB.productos[0].pvp}); drawLin(); }
function delLin(i){ if(LIN.length>1){LIN.splice(i,1);drawLin();} else toast('La factura necesita al menos una línea.'); }
function saveFacturaE(){
  const cliId=val('nf_cli'), fecha=val('nf_fecha');
  const base=LIN.reduce((s,l)=>s+l.cant*l.precio,0);
  if(base<=0){toast('El importe tiene que ser mayor que cero.');return;}
  const falta=LIN.filter(l=>art(l.art).stock<l.cant);
  if(falta.length){toast('No hay stock suficiente de '+falta.map(l=>art(l.art).ref).join(', ')+'. Ajusta las cantidades o repón antes.');return;}
  const nums=DB.facturasE.map(x=>+String(x.num).split('-')[1]).filter(x=>!isNaN(x));
  const f={num:'F26-'+pad(Math.max(0,...nums)+1,4),fecha,cli:cliId,lineas:LIN.map(l=>({...l})),base,cuota:base*IVA,total:base*1.21,
           estado:'Pendiente',venc:addDays(fecha,cli(cliId).cond)};

  if(typeof asignarLotes==='function'){ f.lotes=[]; LIN.forEach(l=>{ const r=asignarLotes(l.art,l.cant,f.num,cliId); r.usados.forEach(u=>f.lotes.push({art:l.art,...u})); }); }
  if(typeof log==='function') log('Factura emitida',f.num+' · '+cli(cliId).nom+' · '+EUR(f.total));

}

function saveMovimiento(){

let SEL={mov:null,doc:null};
ROUTES.concilia=function(){
  const movs=DB.movimientos.filter(m=>!m.conc);
  const docs=[...pendCobro().map(f=>({k:'E',ref:f.num,nom:nomCli(f.cli),imp:f.total,venc:f.venc})),
              ...pendPago().map(f=>({k:'R',ref:f.num,nom:nomProv(f.prov),imp:-f.total,venc:f.venc}))];
  const m=movs.find(x=>x.id===SEL.mov), d=docs.find(x=>x.ref===SEL.doc);
  const dif=(m&&d)?Math.abs(m.imp-d.imp):null, armed=m&&d;
  let h=head('Conciliación bancaria',movs.length+' movimientos sin conciliar · '+docs.length+' facturas abiertas');
  h+='<div class="card" style="margin-bottom:16px"><div class="cardbody" style="font-size:13px;color:var(--ink-2)">Elige un apunte del banco y la factura que le corresponde. Al conciliar se marca la factura como cobrada o pagada y se contabiliza el asiento de tesorería contra la subcuenta del cliente o del proveedor.</div></div>';
  h+='<div class="recon">';
  h+='<div class="col"><h4>Movimientos del banco <span class="tag t-neu">'+movs.length+'</span></h4><div class="reconlist">'+
    (movs.length?movs.map(x=>'<div class="ritem'+(x.id===SEL.mov?' sel':'')+'" onclick="pickMov(\''+x.id+'\')">'+
      '<div class="meta"><div class="t1">'+esc(x.con)+'</div><div class="t2">'+FD(x.fecha)+' · '+esc((DB.bancos.find(b=>b.id===x.cta)||{}).nom)+'</div></div>'+
      '<div class="amt '+(x.imp>0?'pos':'neg')+'">'+EUR(x.imp)+'</div></div>').join('')
      :'<div class="empty"><strong>Todo conciliado</strong>No queda ningún apunte bancario pendiente.</div>')+'</div></div>';
  h+='<div class="bridge'+(armed?' armed':'')+'"><div class="dot"></div><div class="link"></div><div class="dot"></div>'+
    (armed?'<div class="delta '+(dif<0.01?'good':'bad')+'">'+(dif<0.01?'Importes iguales':'Difieren '+EUR(dif))+'</div><button class="btn sm" onclick="conciliar()">Conciliar</button>'
          :'<div class="delta">Elige un apunte y una factura</div>')+'</div>';
  h+='<div class="col"><h4>Facturas abiertas <span class="tag t-neu">'+docs.length+'</span></h4><div class="reconlist">'+
    (docs.length?docs.map(x=>'<div class="ritem'+(x.ref===SEL.doc?' sel':'')+'" onclick="pickDoc(\''+esc(x.ref)+'\')">'+
      '<div class="meta"><div class="t1">'+esc(x.nom)+'</div><div class="t2">'+esc(x.ref)+' · vence '+FD(x.venc)+'</div></div>'+
      '<div class="amt '+(x.imp>0?'pos':'neg')+'">'+EUR(x.imp)+'</div></div>').join('')
      :'<div class="empty"><strong>Sin facturas abiertas</strong>No hay cobros ni pagos pendientes.</div>')+'</div></div></div>';
  return h;
};
function pickMov(id){ SEL.mov=SEL.mov===id?null:id; refresh(); }
function pickDoc(ref){ SEL.doc=SEL.doc===ref?null:ref; refresh(); }
function conciliar(){
  const m=DB.movimientos.find(x=>x.id===SEL.mov);
  const fe=DB.facturasE.find(x=>x.num===SEL.doc), fr=DB.facturasR.find(x=>x.num===SEL.doc);
  if(!m||(!fe&&!fr)) return;
  if((m.imp>0)!==!!fe){toast('Un cobro solo se concilia con factura de cliente, y un pago con factura de proveedor.');return;}
  m.conc=SEL.doc;
  if(fe) fe.estado='Cobrada'; else fr.estado='Pagada';
  asientoCobroPago(m);
  const ref=SEL.doc; SEL={mov:null,doc:null};
  go('concilia'); toast('Conciliado con '+ref+'. Asiento de tesorería generado.');
}

function saveArticulo(id){
  const ref=val('na_ref').trim().toUpperCase(), nom=val('na_nom').trim();
  if(!ref||!nom){toast('Hacen falta la referencia y el nombre.');return;}
  if(DB.productos.some(p=>p.ref===ref&&p.id!==id)){toast('Ya existe un artículo con esa referencia.');return;}
  const datos={ref,nom,fam:val('na_fam').trim()||'General',prov:val('na_prov'),ubi:val('na_ubi').trim(),
               min:+val('na_min')||0,coste:+val('na_coste')||0,pvp:+val('na_pvp')||0};
  if(id){ Object.assign(art(id),datos); toast('Artículo actualizado.'); }
  else{
    const stock=+val('na_stock')||0;
    const p={id:uid('A'),...datos,stock:0,pmp:datos.coste,valor:0};
    DB.productos.push(p);
    if(stock>0) movimientoStock(p.id,'Entrada',stock,datos.coste,'Existencia inicial',TODAY);
    toast('Artículo '+ref+' creado'+(stock?' con '+stock+' unidades':'')+'.');
  }
  closeModal(); go('almacen');
}

function proponerPedidos(){
  const bajos=DB.productos.filter(p=>p.stock<p.min);
  if(!bajos.length){toast('No hay ningún artículo por debajo del mínimo.');return;}
  const porProv={};
  bajos.forEach(p=>{ (porProv[p.prov]=porProv[p.prov]||[]).push({art:p.id,cant:p.min*2-p.stock,precio:p.coste}); });
  let n=0;
  Object.entries(porProv).forEach(([pv,lineas])=>{
    DB.pedidos.push({id:'PC-26-0'+(20+DB.pedidos.length),prov:pv,fecha:TODAY,estado:'Borrador',lineas});
    n++;
  });
  go('compras'); toast(n+' pedido(s) creados en borrador a partir de los mínimos de stock.');
}

function formPedido(_,provPre,artPre){
  const p0=artPre?art(artPre):DB.productos[0];
  PLIN=[{art:p0.id,cant:Math.max(1,p0.min*2-p0.stock)||100,precio:p0.coste}];
  openModal('Nuevo pedido de compra',
    '<div class="frow" style="margin-bottom:16px">'+
      fSelect('Proveedor','np2_prov',DB.proveedores.map(p=>[p.id,p.nom]),provPre)+
      fInput('Fecha','np2_f','date',TODAY)+'</div><div id="plinBox"></div>',
    '<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePedido()">Crear pedido</button>',true);
  drawPlin();

function drawPlin(){
  const rows=PLIN.map((l,i)=>{
    const p=art(l.art);
    return '<tr>'+
    '<td><select onchange="setPlin('+i+',\'art\',this.value)">'+DB.productos.map(x=>'<option value="'+x.id+'"'+(x.id===l.art?' selected':'')+'>'+esc(x.ref+' · '+x.nom)+'</option>').join('')+'</select>'+
      '<div style="font-size:11px;color:var(--ink-2);margin-top:3px" class="mono">stock '+p.stock+' / mín. '+p.min+'</div></td>'+
    '<td style="width:88px"><input type="number" min="1" value="'+l.cant+'" onchange="setPlin('+i+',\'cant\',this.value)"></td>'+
    '<td style="width:98px"><input type="number" step="0.01" value="'+l.precio+'" onchange="setPlin('+i+',\'precio\',this.value)"></td>'+
    '<td class="num mono">'+EUR(l.cant*l.precio)+'</td>'+
    '<td style="width:38px"><button class="btn ghost sm" onclick="delPlin('+i+')">×</button></td></tr>';

function fichajeHoy(empId){ return DB.fichajes.find(f=>f.emp===empId&&f.fecha===TODAY); }
function minAhora(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function minTrabajados(f){
  if(!f||!f.entrada) return 0;
  const fin=f.salida?toMin(f.salida):(f.pausaIni?toMin(f.pausaIni):minAhora());
  return Math.max(0,fin-toMin(f.entrada)-(f.pausa||0));
}
function estadoJornada(f){
  if(!f||!f.entrada) return 'sin_fichar';
  if(f.salida) return 'cerrada';
  if(f.pausaIni) return 'pausa';
  return 'trabajando';
}
function resumenMes(empId){
  const fs=DB.fichajes.filter(f=>f.emp===empId&&f.fecha.startsWith('2026-07'));
  const trab=fs.reduce((s,f)=>s+(f.salida?minTrabajados(f):0),0);
  const teor=diasLaborables('2026-07-01',addDays(TODAY,-1))*JORNADA;
  return {dias:fs.length,trab,teor,saldo:trab-teor,inc:fs.filter(f=>f.entrada&&!f.salida).length};
}

function fichar(accion){
  let f=fichajeHoy(ME.emp);
  const ahora=hm(minAhora());

    DB.fichajes.push({id:uid('FJ'),emp:ME.emp,fecha:TODAY,entrada:ahora,salida:null,pausa:0,pausaIni:null,obs:''});
    toast('Entrada registrada a las '+ahora+'.');
  } else if(accion==='pausa'){ f.pausaIni=ahora; toast('Pausa iniciada a las '+ahora+'.'); }
  else if(accion==='volver'){ f.pausa=(f.pausa||0)+Math.max(0,minAhora()-toMin(f.pausaIni)); f.pausaIni=null; toast('Pausa cerrada. Acumuladas '+f.pausa+' min.'); }
  else if(accion==='salida'){
    if(f.pausaIni){ f.pausa=(f.pausa||0)+Math.max(0,minAhora()-toMin(f.pausaIni)); f.pausaIni=null; }
    f.salida=ahora;

    toast('Salida a las '+ahora+'. Jornada de '+hDur(minTrabajados(f))+' ('+(saldo>=0?'+':'')+hDur(saldo)+' sobre la teórica).');
  }
  refresh();
}

}

/* ---------- Cálculos de fabricación ---------- */
function mp(id){ return DB.materias.find(m=>m.id===id)||{nom:'—',coste:0,unidad:'',stock:0}; }
function formulaVigente(prodId){ return DB.formulas.find(f=>f.prod===prodId&&f.estado==='Vigente'); }
function formulasDe(prodId){ return DB.formulas.filter(f=>f.prod===prodId).sort((a,b)=>b.version-a.version); }
const TARIFA_HORA=22;
function costeFormula(f){
  const granel=f.comp.reduce((s,c)=>s+(c.pct/100)*f.litros*mp(c.mp).coste,0);
  const env=f.envase.reduce((s,e)=>s+e.cant*mp(e.mp).coste,0);
  const mano=(f.minUd/60)*TARIFA_HORA;
  return {granel,env,mano,total:granel+env+mano};
}
function consumoOF(f,unidades){
  const c=f.comp.map(x=>({mp:x.mp,cant:(x.pct/100)*f.litros*unidades,ud:mp(x.mp).unidad}));
  f.envase.forEach(e=>c.push({mp:e.mp,cant:e.cant*unidades,ud:mp(e.mp).unidad}));
  return c;
}
function faltaMP(consumo){ return consumo.filter(c=>mp(c.mp).stock<c.cant); }
function diasHasta(f){ return Math.round((new Date(f+'T00:00:00Z')-new Date(TODAY+'T00:00:00Z'))/86400000); }
function lotesDe(prodId){ return DB.lotes.filter(l=>l.prod===prodId); }
function stockLotes(prodId){ return lotesDe(prodId).filter(l=>l.estado==='Liberado').reduce((s,l)=>s+l.disp,0); }

/* Asignación FEFO: sale antes lo que antes caduca */
function asignarLotes(prodId,cant,factNum,cliId){
  const disp=lotesDe(prodId).filter(l=>l.estado==='Liberado'&&l.disp>0).sort((a,b)=>a.cad.localeCompare(b.cad));
  const usados=[]; let pend=cant;
  disp.forEach(l=>{
    if(pend<=0) return;
    const t=Math.min(l.disp,pend); l.disp-=t; pend-=t;
    l.destino.push({fact:factNum,cli:cliId,cant:t});
    usados.push({lote:l.lote,cant:t,cad:l.cad});
  });
  return {usados,pend};
}

function saveOF(){
  const v=i=>document.getElementById(i).value, c=+v('of_c')||0;
  if(c<=0){toast('Indica cuántas unidades hay que fabricar.');return;}
  const f=formulaVigente(v('of_p'));
  const id='OF-26-0'+(47+DB.ofs.filter(o=>o.id.startsWith('OF-26')).length);
  DB.ofs.push({id,prod:v('of_p'),formula:f.id,cant:c,estado:'Planificada',ini:TODAY,fin:null,
    operario:v('of_o'),maquina:v('of_m'),lote:null,minutos:0,consumo:consumoOF(f,c),obs:''});
  log('Orden de fabricación creada',id+' · '+art(v('of_p')).nom+' · '+c+' ud');
  closeModal();go('produccion');toast('Orden '+id+' creada.');
}
function lanzarOF(id){
  const o=DB.ofs.find(x=>x.id===id);
  if(faltaMP(o.consumo).length){toast('No hay material suficiente para lanzar la orden.');return;}
  o.estado='En curso'; o.ini=TODAY;
  log('Fabricación lanzada',id);
  closeModal();go('produccion');toast('Orden '+id+' en curso. Materias primas reservadas.');
}
function finalizarOF(id){
  const o=DB.ofs.find(x=>x.id===id), p=art(o.prod);
  // Consumo real de materias primas, descontando de sus lotes (FEFO)
  o.lotesConsumidos=[];
  o.consumo.forEach(c=>{
    const m=mp(c.mp); let pend=c.cant;
    m.lotes.sort((a,b)=>a.cad.localeCompare(b.cad)).forEach(l=>{
      if(pend<=0) return;
      const t=Math.min(l.cant,pend); l.cant-=t; pend-=t;
      if(t>0) o.lotesConsumidos.push({mp:c.mp,lote:l.lote,cant:t});
    });
    m.stock=Math.max(0,m.stock-c.cant);
  });
  const lote='L26-'+TODAY.slice(5,7)+TODAY.slice(8,10)+(DB.lotes.filter(l=>l.fab===TODAY).length||'');
  const cad=new Date(TODAY); cad.setMonth(cad.getMonth()+(p.cadMeses||24));
  DB.lotes.push({lote,prod:o.prod,of:o.id,fab:TODAY,cad:cad.toISOString().slice(0,10),cant:o.cant,disp:o.cant,
    estado:'Cuarentena',analisis:{ph:null,dens:null,visc:null,fecha:null,tecnico:null},destino:[]});
  o.estado='Finalizada'; o.fin=TODAY; o.lote=lote; o.minutos=Math.round((formulaVigente(o.prod).minUd)*o.cant);
  const costeUd=costeFormula(formulaVigente(o.prod)).total;
  movimientoStock(o.prod,'Entrada',o.cant,costeUd,'Fabricación '+o.id,TODAY);
  log('Fabricación finalizada',id+' · lote '+lote+' · '+o.cant+' ud');
  closeModal();go('lotes');
  toast('Lote '+lote+' generado en cuarentena. Pasa por control de calidad antes de venderse.');
}

/* ---------- Vista: automatizaciones ---------- */
function evaluarReglas(){
  const out=[];
  DB.reglas.filter(r=>r.activa).forEach(r=>{
    if(r.tipo==='stock') DB.productos.filter(p=>p.stock<p.min).forEach(p=>
      out.push({regla:r,txt:art(p.id).nom+': '+NUM(p.stock)+' ud, mínimo '+NUM(p.min),accion:'Pedido a '+nomProv(p.prov),dato:p.id}));
    if(r.tipo==='mp') DB.materias.filter(m=>m.stock<m.min).forEach(m=>
      out.push({regla:r,txt:m.nom+': '+NUM(m.stock)+' '+m.unidad+', mínimo '+NUM(m.min),accion:'Avisar a producción',dato:m.id}));
    if(r.tipo==='caducidad') DB.lotes.filter(l=>l.disp>0&&diasHasta(l.cad)<90).forEach(l=>
      out.push({regla:r,txt:'Lote '+l.lote+' ('+art(l.prod).nom+') caduca en '+diasHasta(l.cad)+' días con '+NUM(l.disp)+' ud',accion:'Venta prioritaria o retirada',dato:l.lote}));
    if(r.tipo==='cobro') DB.facturasE.filter(vencida).forEach(f=>
      out.push({regla:r,txt:'Factura '+f.num+' de '+nomCli(f.cli)+' vencida el '+FD(f.venc)+' · '+EUR(f.total),accion:'Reclamar el cobro',dato:f.num}));
    if(r.tipo==='riesgo') DB.clientes.filter(c=>riesgoCliente(c.id).supera).forEach(c=>{
      const r2=riesgoCliente(c.id);
      out.push({regla:r,txt:c.nom+': riesgo vivo '+EUR(r2.exp)+' sobre un límite de '+EUR(r2.lim),accion:'Revisar antes de facturar',dato:c.id});
    });
  });
  return out;
}
function vAutomat(){
  const disp=evaluarReglas();
  let h=head('Automatizaciones',disp.length+' situaciones detectadas ahora mismo · las reglas se evalúan sobre los datos reales',
    '<button class="btn" onclick="ejecutarReglas()">Ejecutar todas</button>');
  h+='<div class="card" style="margin-bottom:16px"><h3>Reglas configuradas</h3>'+
    tbl([['Regla'],['Cuando…'],['Entonces…'],['Estado'],['']],
      DB.reglas.map(r=>rowN(['<strong>'+esc(r.nom)+'</strong>',esc(r.cuando),esc(r.entonces),
        r.activa?'<span class="tag t-ok">Activa</span>':'<span class="tag t-neu">Pausada</span>',
        '<button class="btn ghost sm" onclick="toggleRegla(\''+r.id+'\')">'+(r.activa?'Pausar':'Activar')+'</button>'],[])))+'</div>';
  h+='<div class="card"><h3>Qué dispararían ahora <span class="tag '+(disp.length?'t-wait':'t-ok')+'">'+disp.length+'</span></h3>'+
    (disp.length?tbl([['Regla'],['Situación detectada'],['Acción propuesta']],
      disp.map(d=>rowN(['<span class="tag t-blue">'+esc(d.regla.nom)+'</span>',esc(d.txt),esc(d.accion)],[])))
      :'<div class="empty"><strong>Nada que hacer</strong>Ninguna regla activa encuentra situaciones que requieran acción.</div>')+'</div>';
  return h;
}
function toggleRegla(id){ const r=DB.reglas.find(x=>x.id===id); r.activa=!r.activa; log('Regla '+(r.activa?'activada':'pausada'),r.nom); refresh(); }
function ejecutarReglas(){
  const disp=evaluarReglas(); let pedidos=0, avisos=0;
  // Solo la regla de reposición crea documentos; el resto genera avisos
  const porProv={};
  disp.filter(d=>d.regla.tipo==='stock').forEach(d=>{
    const p=art(d.dato), q=Math.max(1,p.min*2-p.stock);
    (porProv[p.prov]=porProv[p.prov]||[]).push({art:p.id,cant:q,precio:p.coste});
  });
  Object.keys(porProv).forEach(prov=>{
    const id='PC-26-0'+(20+DB.pedidos.length);
    DB.pedidos.push({id,prov,fecha:TODAY,estado:'Borrador',lineas:porProv[prov]});
    log('Pedido automático creado',id+' · '+nomProv(prov)+' · '+porProv[prov].length+' líneas');
    pedidos++;
  });
  avisos=disp.length-disp.filter(d=>d.regla.tipo==='stock').length;
  refresh();
  toast(pedidos?pedidos+' pedido(s) de compra creados en borrador y '+avisos+' avisos generados.':'Sin reposiciones pendientes. '+avisos+' avisos generados.');
}

function buscar(q){
  q=(q||'').toLowerCase().trim();
  const acciones=[
    {t:'Nueva factura de cliente',s:'Facturación',k:'Acción',go:()=>{closePalette();formFacturaE();}},
    {t:'Registrar factura de proveedor',s:'Facturación',k:'Acción',go:()=>{closePalette();formFacturaR();}},

    {t:'Conciliar movimientos bancarios',s:'Bancos',k:'Acción',go:()=>{closePalette();go('concilia');}},
    {t:'Cambiar a modo claro u oscuro',s:'Sistema',k:'Acción',go:()=>{closePalette();toggleTema();}}
  ];
  const vistas=NAV.flatMap(x=>x.items).filter(i=>can(i[2])).map(i=>({t:i[1],s:'Ir a la sección',k:'Sección',go:()=>{closePalette();go(i[0]);}}));
  const datos=[
    ...DB.clientes.map(c=>({t:c.nom,s:'Cliente · '+c.nif+' · '+c.pob,k:'Cliente',go:()=>{closePalette();go('clientes');fichaCliente(c.id);}})),
    ...DB.productos.map(p=>({t:p.nom,s:'Producto · '+p.ref+' · stock '+p.stock,k:'Producto',go:()=>{closePalette();go('almacen');fichaProducto(p.id);}})),
    ...DB.materias.map(m=>({t:m.nom,s:'Materia prima · '+m.ref,k:'Materia',go:()=>{closePalette();go('materias');}})),
    ...DB.facturasE.map(f=>({t:f.num,s:'Factura a '+nomCli(f.cli)+' · '+EUR(f.total)+' · '+f.estado,k:'Factura',go:()=>{closePalette();go('femitidas');verFacturaE(f.num);}})),
    ...DB.facturasR.map(f=>({t:f.num,s:'Factura de '+nomProv(f.prov)+' · '+EUR(f.total),k:'Compra',go:()=>{closePalette();go('frecibidas');}})),
    ...DB.lotes.map(l=>({t:l.lote,s:'Lote de '+art(l.prod).nom+' · caduca '+FD(l.cad),k:'Lote',go:()=>{closePalette();go('lotes');verTrazabilidad(l.lote);}})),
    ...DB.ofs.map(o=>({t:o.id,s:'Fabricación de '+art(o.prod).nom+' · '+o.estado,k:'Orden',go:()=>{closePalette();go('produccion');verOF(o.id);}})),
    ...DB.empleados.map(e=>({t:e.nom,s:'Empleado · '+e.cat,k:'Persona',go:()=>{closePalette();go('rrhh');verNomina(e.id);}}))
  ];
  const todo=[...acciones,...vistas,...datos];
  if(!q) return todo.filter(x=>x.k==='Acción'||x.k==='Sección').slice(0,8);
  return todo.filter(x=>(x.t+' '+x.s).toLowerCase().includes(q)).slice(0,12);
}
function drawPalette(){
  PRES=buscar(document.getElementById('pq').value);
  document.getElementById('pl').innerHTML = PRES.length
    ? PRES.map((r,i)=>'<div class="pres'+(i===PSEL?' k':'')+'" onclick="PRES['+i+'].go()"><div><div class="pt">'+esc(r.t)+'</div><div class="ps">'+esc(r.s)+'</div></div><span class="pk">'+r.k+'</span></div>').join('')
    : '<div class="empty"><strong>Sin resultados</strong>Prueba con el nombre de un cliente, un número de factura o un lote.</div>';
}
function openPalette(){
  document.getElementById('palette').classList.add('on');
  const q=document.getElementById('pq'); q.value=''; PSEL=0; drawPalette(); q.focus();
}
function closePalette(){ document.getElementById('palette').classList.remove('on'); }
document.getElementById('pq').addEventListener('input',()=>{PSEL=0;drawPalette();});
document.getElementById('palette').addEventListener('click',e=>{ if(e.target.id==='palette') closePalette(); });
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); if(ME) openPalette(); return; }
  if(!document.getElementById('palette').classList.contains('on')) return;
  if(e.key==='Escape') closePalette();
  if(e.key==='ArrowDown'){ e.preventDefault(); PSEL=Math.min(PRES.length-1,PSEL+1); drawPalette(); }
  if(e.key==='ArrowUp'){ e.preventDefault(); PSEL=Math.max(0,PSEL-1); drawPalette(); }
  if(e.key==='Enter'&&PRES[PSEL]) PRES[PSEL].go();
});

/* ---------- Panel logístico: KPIs y clasificación ABC ---------- */
function rotacionInventario(){
  const cogs = DB.movStock.filter(m=>m.tipo==='Salida').reduce((s,m)=>s+m.importe,0);
  const valorMedio = DB.productos.reduce((s,p)=>s+p.valor,0) || 1;
  return cogs / valorMedio;
}
function coberturaStockDias(){
  const salidaDiaria = DB.movStock.filter(m=>m.tipo==='Salida').reduce((s,m)=>s+m.importe,0) / 90;
  const valor = DB.productos.reduce((s,p)=>s+p.valor,0);
  return salidaDiaria>0 ? Math.round(valor/salidaDiaria) : 0;
}
function clasificacionABC(){
  const ventas = {};
  DB.facturasE.forEach(f=>f.lineas.forEach(l=>{ ventas[l.art]=(ventas[l.art]||0)+l.cant*l.precio; }));
  const filas = DB.productos.map(p=>({p, valor:ventas[p.id]||0})).sort((a,b)=>b.valor-a.valor);
  const total = filas.reduce((s,x)=>s+x.valor,0) || 1;
  let acum = 0;
  return filas.map(x=>{
    acum += x.valor;
    const pct = acum/total*100;
    const clase = pct<=80 ? 'A' : pct<=95 ? 'B' : 'C';
    return {...x, pctAcum:pct, clase};
  });
}

  const otif = entregadas.length ? Math.round(aTiempo.length/entregadas.length*100) : 100;
  const costeTransp = DB.expediciones.reduce((s,e)=>s+ (nomTransp(e.transp)!=='—' ? (DB.transportistas.find(t=>t.id===e.transp)||{tarifa:0}).tarifa : 0), 0);
  const ventasBase = DB.facturasE.reduce((s,f)=>s+f.base,0) || 1;

  let h = '';

/* ---------- utilidades comunes ---------- */
function diasEntre(a,b){ return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/86400000); }

/* =========================================================
   PANEL COMERCIAL — funnel, conversión, RFM
   ========================================================= */
function segmentoCliente(rfm){
  if(rfm.frecuencia>=3 && rfm.recencia<=45) return {label:'VIP', clase:'t-ok'};
  if(rfm.recencia>90) return {label:'En riesgo', clase:'t-late'};
  if(rfm.frecuencia===1) return {label:'Nuevo', clase:'t-blue'};
  return {label:'Fiel', clase:'t-neu'};
}
function calcularRFM(){
  return DB.clientes.map(c=>{
    const facs = DB.facturasE.filter(f=>f.cli===c.id);
    const ultima = facs.length ? facs.reduce((a,f)=>f.fecha>a?f.fecha:a, facs[0].fecha) : null;
    const recencia = ultima ? diasEntre(ultima, TODAY) : 999;
    const frecuencia = facs.length;
    const monetario = facs.reduce((s,f)=>s+f.total,0);
    const seg = segmentoCliente({recencia, frecuencia});
    return {c, recencia, frecuencia, monetario, seg};
  }).sort((a,b)=>b.monetario-a.monetario);
}

/* =========================================================
   PANEL FINANCIERO — ratios y ciclo de conversión de caja
   ========================================================= */
ROUTES.panelfinanciero = function(){
  const s = saldosCuentas(FECHA_CORTE);
  const saldo = c => ((s[c]||{d:0}).d - (s[c]||{h:0}).h);
  const porTipo = t => Object.keys(s).filter(c=>tipoCta(c)===t);
  const activo = porTipo('activo').reduce((a,c)=>a+Math.max(0,saldo(c)),0);
  const pasivo = porTipo('pasivo').reduce((a,c)=>a+Math.max(0,-saldo(c)),0);
  const existencias = DB.productos.reduce((s2,p)=>s2+p.valor,0);

  const clientesPend = DB.facturasE.filter(f=>f.estado==='Pendiente').reduce((s2,f)=>s2+f.total,0);
  const provPend = DB.facturasR.filter(f=>f.estado==='Pendiente').reduce((s2,f)=>s2+f.total,0);
  const ventasBase = DB.facturasE.reduce((s2,f)=>s2+f.base,0) || 1;
  const comprasBase = DB.facturasR.reduce((s2,f)=>s2+f.base,0) || 1;
  const PERIODO = 90;
  const dso = Math.round(clientesPend/ventasBase*PERIODO);
  const dpo = Math.round(provPend/comprasBase*PERIODO);
  const dio = typeof coberturaStockDias==='function' ? coberturaStockDias() : 0;
  const ccc = dio + dso - dpo;

  const activoCorriente = activo + existencias;
  const ratioLiquidez = pasivo ? activoCorriente/pasivo : 0;
  const ratioTesoreria = pasivo ? activo/pasivo : 0;
  const fondoManiobra = activoCorriente - pasivo;

  let h = '';
  h += '<div class="grid g4" style="margin-bottom:16px">'+
    kpi('Ratio de liquidez', NUM(ratioLiquidez), 'activo corriente ÷ pasivo corriente', ratioLiquidez>=1.5?'teal':ratioLiquidez>=1?'amber':'red')+
    kpi('Prueba ácida', NUM(ratioTesoreria), '(activo corriente − existencias) ÷ pasivo', ratioTesoreria>=1?'teal':'amber')+
    kpi('Fondo de maniobra', EUR(fondoManiobra), 'activo corriente − pasivo corriente', fondoManiobra>=0?'teal':'red')+
    kpi('Ciclo de conversión de caja', ccc+' días', 'DIO + DSO − DPO', ccc<=45?'teal':ccc<=75?'amber':'red')+
    '</div>';

  h += '<div class="grid g3" style="margin-bottom:16px">'+
    kpi('DSO · cobro a clientes', dso+' días', EUR(clientesPend)+' pendientes de cobro', 'blue')+
    kpi('DPO · pago a proveedores', dpo+' días', EUR(provPend)+' pendientes de pago', 'blue')+
    kpi('DIO · rotación de existencias', dio+' días', EUR(existencias)+' en almacén', 'blue')+
    '</div>';

  h += '<div class="card"><h3>Cómo se lee el ciclo de caja</h3><div class="cardbody" style="font-size:13px;line-height:1.9">'+
    '<div class="rec">'+
      '<div class="l"><span>Días que tarda en venderse el stock (DIO)</span><span>'+dio+' días</span></div>'+
      '<div class="l"><span>+ Días que tarda en cobrarse la venta (DSO)</span><span>'+dso+' días</span></div>'+
      '<div class="l"><span>− Días que se tarda en pagar la compra (DPO)</span><span>'+dpo+' días</span></div>'+
      '<div class="tot"><span>= Ciclo de conversión de caja</span><span>'+ccc+' días</span></div>'+
    '</div>'+
    '<p style="margin-top:12px;color:var(--ink-2);font-size:12.5px">Es el número de días que la empresa tiene el dinero inmovilizado entre pagar a un proveedor y cobrar del cliente final. Cuanto más corto, menos necesidad de financiación externa. El cálculo trata todo el pasivo como corriente al no haber deuda a largo plazo registrada en el ejercicio.</p>'+
    '</div></div>';
  return h;
};

function saldosCuentas2025(hasta){
  const m={};
  DB.asientos2025.filter(a=>!hasta||a.fecha<=hasta).forEach(a=>a.apuntes.forEach(p=>{
    m[p.cta]=m[p.cta]||{d:0,h:0}; m[p.cta].d+=(p.d||0); m[p.cta].h+=(p.h||0);
  }));
  return m;
}
function saldosCuentas2025PreCierre(){
  // Saldos reales a 31/12/2025 excluyendo únicamente los dos asientos mecánicos de
  // cierre (regularización de PyG y cierre de balance), que ya trasladan el resultado
  // a la 129 y ponen todo a cero. Los ajustes reales de 31/12 (amortización, deterioro,
  // variación de existencias, periodificación) SÍ se incluyen, porque son operaciones
  // reales del ejercicio, no mecánica de cierre.
  const EXCLUIR = ['ARCHIVO2025:REGUL-2025','ARCHIVO2025:CIERRE-2025'];
  const m={};
  DB.asientos2025.filter(a=>!EXCLUIR.includes(a.origen)).forEach(a=>a.apuntes.forEach(p=>{
    m[p.cta]=m[p.cta]||{d:0,h:0}; m[p.cta].d+=(p.d||0); m[p.cta].h+=(p.h||0);
  }));
  return m;
}
let VISTA2025 = 'diario';
let CTA2025_SEL = null;

function resultado2025(){
  // Se excluyen solo los dos asientos puramente mecánicos de cierre (regularización y cierre
  // de balance), que ya trasladan el resultado a la cuenta 129 y ponen todo a cero. Los ajustes
  // reales de 31/12 (amortización, deterioro, variación de existencias, periodificación) SÍ cuentan,
  // porque son gasto/ingreso real del ejercicio, no mecánica de cierre.
  const EXCLUIR = ['ARCHIVO2025:REGUL-2025','ARCHIVO2025:CIERRE-2025'];
  const m={};
  DB.asientos2025.filter(a=>!EXCLUIR.includes(a.origen)).forEach(a=>a.apuntes.forEach(p=>{
    m[p.cta]=m[p.cta]||{d:0,h:0}; m[p.cta].d+=(p.d||0); m[p.cta].h+=(p.h||0);
  }));
  const saldo = c => ((m[c]||{d:0}).d - (m[c]||{h:0}).h);
  const ingresos = Object.keys(m).filter(c=>tipoCta(c)==='ingreso').reduce((a,c)=>a+(-saldo(c)),0);
  const gastos   = Object.keys(m).filter(c=>tipoCta(c)==='gasto').reduce((a,c)=>a+saldo(c),0);
  return ingresos - gastos;
}

function resultadoDetalle2025(){
  const EXCLUIR = ['ARCHIVO2025:REGUL-2025','ARCHIVO2025:CIERRE-2025'];
  const m={};
  DB.asientos2025.filter(a=>!EXCLUIR.includes(a.origen)).forEach(a=>a.apuntes.forEach(p=>{
    m[p.cta]=m[p.cta]||{d:0,h:0}; m[p.cta].d+=(p.d||0); m[p.cta].h+=(p.h||0);
  }));
  const sal = c => ((m[c]||{d:0}).d - (m[c]||{h:0}).h);
  const ventasBruto = -sal('701');
  const devoluciones = sal('708');
  const importeNeto = ventasBruto - devoluciones;
  const variacionExistencias = sal('610') + sal('710');
  const aprovisionamientos = sal('601') + sal('602');
  const gastosPersonal = sal('640') + sal('642');
  const otrosGastosExplotacion = ['622','623','624','625','627','628','629','631'].reduce((a,c)=>a+sal(c),0);
  const amortizacion = sal('680') + sal('681');
  const deterioro = sal('694');
  const resultadoExplotacion = importeNeto - variacionExistencias - aprovisionamientos - gastosPersonal - otrosGastosExplotacion - amortizacion - deterioro;
  const gastosFinancieros = sal('662');
  const resultadoFinanciero = -gastosFinancieros;
  const resultadoAntesImpuestos = resultadoExplotacion + resultadoFinanciero;
  const impuesto = 0;
  const resultadoEjercicio = resultadoAntesImpuestos - impuesto;
  return {importeNeto, variacionExistencias, aprovisionamientos, gastosPersonal, otrosGastosExplotacion,
          amortizacion, deterioro, resultadoExplotacion, gastosFinancieros, resultadoFinanciero,
          resultadoAntesImpuestos, impuesto, resultadoEjercicio};
}

    '.rec .l{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #EEF2F5}'+
    '.rec .tot{font-weight:700;border-top:2px solid #0F1D2B;border-bottom:none;margin-top:4px;padding-top:6px}'+
    '@media print{ @page{margin:15mm} }'+
    '</style></head><body>'+
    '<h1>HIGIENEX S.L. — '+esc(titulo)+'</h1>'+
    '<div class="sub">Ejercicio 2025 · Generado el '+new Date().toLocaleString('es-ES')+'</div>'+
    cuerpo+
    '</body></html>';
  w.document.open(); w.document.write(html); w.document.close();
  w.focus();
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 350);
}

function pdfBodyDiario2025(){
  let rows=''; let td=0, th=0;
  DB.asientos2025.forEach(a=>{
    a.apuntes.forEach((p,i)=>{
      td+=(p.d||0); th+=(p.h||0);
      rows += '<tr><td>'+(i===0?a.n:'')+'</td><td>'+(i===0?FD(a.fecha):'')+'</td><td>'+p.cta+'</td><td>'+esc(nomCta(p.cta))+(i===0?' — '+esc(a.concepto):'')+'</td><td class="num">'+(p.d?NUM(p.d):'')+'</td><td class="num">'+(p.h?NUM(p.h):'')+'</td></tr>';
    });
  });
  rows += '<tr class="total"><td colspan="4">TOTAL DIARIO ('+DB.asientos2025.length+' asientos)</td><td class="num">'+NUM(td)+'</td><td class="num">'+NUM(th)+'</td></tr>';
  return '<table><thead><tr><th>Nº</th><th>Fecha</th><th>Cuenta</th><th>Denominación</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function pdfBodyMayor2025(){
  const s = saldosCuentas2025();
  const cuentas = Object.keys(s).sort();
  let out='';
  cuentas.forEach(c=>{
    let saldo=0, rows='';
    DB.asientos2025.forEach(a=>{
      a.apuntes.forEach(p=>{
        if(p.cta===c){
          saldo += (p.d-p.h);
          rows += '<tr><td>'+FD(a.fecha)+'</td><td>'+esc(a.concepto)+'</td><td class="num">'+(p.d?NUM(p.d):'')+'</td><td class="num">'+(p.h?NUM(p.h):'')+'</td><td class="num">'+NUM(saldo)+'</td></tr>';
        }
      });
    });
    out += '<h2>'+c+' · '+esc(nomCta(c))+'</h2><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo</th></tr></thead><tbody>'+rows+'</tbody></table>';
  });
  return out;
}

function pdfBodySumas2025(){
  const s = saldosCuentas2025();
  const ks = Object.keys(s).sort();
  let rows=''; const T={d:0,h:0,sd:0,sh:0};
  ks.forEach(k=>{
    const d=s[k].d, hh=s[k].h, sd=Math.max(0,d-hh), sh=Math.max(0,hh-d);
    T.d+=d; T.h+=hh; T.sd+=sd; T.sh+=sh;
    rows += '<tr><td>'+k+'</td><td>'+esc(nomCta(k))+'</td><td class="num">'+NUM(d)+'</td><td class="num">'+NUM(hh)+'</td><td class="num">'+(sd?NUM(sd):'')+'</td><td class="num">'+(sh?NUM(sh):'')+'</td></tr>';
  });
  rows += '<tr class="total"><td colspan="2">TOTALES</td><td class="num">'+NUM(T.d)+'</td><td class="num">'+NUM(T.h)+'</td><td class="num">'+NUM(T.sd)+'</td><td class="num">'+NUM(T.sh)+'</td></tr>';
  return '<table><thead><tr><th>Cuenta</th><th>Denominación</th><th class="num">Suma Debe</th><th class="num">Suma Haber</th><th class="num">Saldo Deudor</th><th class="num">Saldo Acreedor</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function pdfBodyBalance2025(){
  const s = saldosCuentas2025PreCierre();
  const saldo = c => ((s[c]||{d:0}).d-(s[c]||{h:0}).h);
  const porTipo = t => Object.keys(s).filter(c=>tipoCta(c)===t);
  const activo = porTipo('activo').map(c=>[c,saldo(c)]).filter(x=>Math.abs(x[1])>0.005);
  const pasivo = porTipo('pasivo').map(c=>[c,-saldo(c)]).filter(x=>Math.abs(x[1])>0.005);
  const neto   = porTipo('pn').map(c=>[c,-saldo(c)]).filter(x=>Math.abs(x[1])>0.005);
  const resultado = resultado2025();
  const totAct = activo.reduce((a,x)=>a+x[1],0);
  const totPas = pasivo.reduce((a,x)=>a+x[1],0);
  const totNet = neto.reduce((a,x)=>a+x[1],0) + resultado;
  const lineas = arr => arr.sort((a,b)=>a[0].localeCompare(b[0])).map(x=>'<div class="l"><span>'+x[0]+' '+esc(nomCta(x[0]))+'</span><span>'+EUR(x[1])+'</span></div>').join('');
  const lineaResultado = '<div class="l"><span>Resultado del ejercicio (pendiente de aplicación)</span><span>'+EUR(resultado)+'</span></div>';
  return '<div class="rec">'+
    '<h2>Activo</h2>'+(activo.length?lineas(activo):'<div class="l"><span>Sin saldo</span><span>0,00 €</span></div>')+
    '<div class="l tot"><span>Total activo</span><span>'+EUR(totAct)+'</span></div>'+
    '<h2>Patrimonio neto</h2>'+lineas(neto)+lineaResultado+
    '<h2>Pasivo</h2>'+(pasivo.length?lineas(pasivo):'<div class="l"><span>Sin saldo</span><span>0,00 €</span></div>')+
    '<div class="l tot"><span>Total patrimonio neto y pasivo</span><span>'+EUR(totNet+totPas)+'</span></div>'+
    '</div>';
}

function pdfBodyPyG2025(){
  const r = resultadoDetalle2025();
  const linea = (label,val,destacado)=>'<div class="l'+(destacado?' tot':'')+'"><span>'+label+'</span><span>'+EUR(val)+'</span></div>';
  return '<div class="rec">'+
    linea('1. Importe neto de la cifra de negocios', r.importeNeto)+
    linea('2. Variación de existencias', -r.variacionExistencias)+
    linea('3. Aprovisionamientos', -r.aprovisionamientos)+
    linea('4. Gastos de personal', -r.gastosPersonal)+
    linea('5. Otros gastos de explotación', -r.otrosGastosExplotacion)+
    linea('6. Amortización del inmovilizado', -r.amortizacion)+
    linea('7. Deterioro y otros resultados', -r.deterioro)+
    linea('A) RESULTADO DE EXPLOTACIÓN', r.resultadoExplotacion, true)+
    linea('8. Gastos financieros', -r.gastosFinancieros)+
    linea('B) RESULTADO FINANCIERO', r.resultadoFinanciero, true)+
    linea('C) RESULTADO ANTES DE IMPUESTOS (A+B)', r.resultadoAntesImpuestos, true)+
    linea('9. Impuesto sobre beneficios', -r.impuesto)+
    linea('D) RESULTADO DEL EJERCICIO', r.resultadoEjercicio, true)+
    '</div>';
}

function pdfBodyIsoc2025(){
  const resultado = resultado2025(); const tipo=0.25; const base=resultado; const cuota=Math.max(0,base*tipo);
  const hayCuota = base > 0;
  const linea=(l,v,d)=>'<div class="l'+(d?' tot':'')+'"><span>'+l+'</span><span>'+EUR(v)+'</span></div>';
  return '<div class="rec">'+
      linea('Resultado contable del ejercicio', resultado)+
      linea('Ajustes fiscales (no identificados)', 0)+
      linea('Base imponible', base, true)+
      '<div class="l"><span>Tipo general aplicable</span><span>'+NUM(tipo*100)+' %</span></div>'+
      linea('Cuota íntegra', cuota, true)+
    '</div>'+
    (base<0
      ? '<p style="margin-top:14px;font-size:11px"><strong>No hay cuota a ingresar.</strong> Base imponible negativa (pérdida de '+EUR(Math.abs(base))+'). Queda pendiente de compensar con bases imponibles positivas de ejercicios futuros, sin límite temporal (límite del 70% de la base positiva de cada año siguiente, salvo el primer millón de euros).</p>'
      : '<p style="margin-top:14px;font-size:11px;color:#3C5063">Cálculo simplificado de nivel escolar: sin ajustes por gastos no deducibles, diferencias temporarias, ni bonificaciones o deducciones. Cuota a ingresar según Modelo 200.</p>');
}

  const map = {
    diario:  ['Libro diario',                        pdfBodyDiario2025],

}
