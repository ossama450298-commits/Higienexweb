<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pàgina no trobada · HIGIENEX S.L.</title>
<meta name="robots" content="noindex">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0B3D6B 0%, #1565A8 55%, #2E86C7 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .box {
    background: #fff;
    border-radius: 24px;
    max-width: 460px;
    width: 100%;
    padding: 3rem 2.4rem 2.6rem;
    text-align: center;
    box-shadow: 0 30px 90px rgba(0,0,0,0.3);
  }
  .brand {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: #0B3D6B;
    margin-bottom: 1.6rem;
  }
  .brand span { color: #F2A900; }
  .code {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 4.2rem;
    font-weight: 800;
    color: #0B3D6B;
    line-height: 1;
    margin-bottom: 0.4rem;
    letter-spacing: -0.02em;
  }
  h1 {
    font-size: 1.15rem;
    color: #1A1A1A;
    margin-bottom: 0.6rem;
  }
  p {
    font-size: 0.9rem;
    color: #555;
    line-height: 1.6;
    margin-bottom: 1.8rem;
  }
  .btns { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.85rem;
    text-decoration: none;
    transition: transform 0.15s;
  }
  a.btn:hover { transform: translateY(-2px); }
  a.btn.primary { background: #F2A900; color: #1A1A1A; }
  a.btn.ghost { background: #fff; color: #0B3D6B; border: 1.5px solid #D9E5F0; }
</style>
</head>
<body>
  <div class="box">
    <div class="brand">HIGIENE<span>X</span></div>
    <div class="code">404</div>
    <h1>Aquesta pàgina no existeix</h1>
    <p>Sembla que l'enllaç que has seguit no és correcte o la pàgina s'ha mogut. Torna a l'inici per continuar navegant.</p>
    <div class="btns">
      <a class="btn primary" href="/Higienexweb/">🏠 Tornar a l'inici</a>
      <a class="btn ghost" href="mailto:contacto@higienexvalencia.es">✉️ Contactar</a>
    </div>
  </div>
</body>
</html>
